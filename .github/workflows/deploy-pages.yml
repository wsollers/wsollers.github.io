name: Publish wsollers.dev
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "CNAME"
      - ".nojekyll"
      - "assets/**"
      - "AdventuresInMath/**"
      - "appsec-review/**"
      - "explorer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Refresh public artifacts from source projects even when this repo has not changed.
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out central site
        uses: actions/checkout@v4
        with:
          path: central
          persist-credentials: false
      - name: Check out mathematics repository
        uses: actions/checkout@v4
        with:
          repository: wsollers/AdventuresInMathematics
          ref: main
          path: math
          persist-credentials: false
      - name: Check out application-security repository
        uses: actions/checkout@v4
        with:
          repository: wsollers/appsec-review
          ref: main
          path: appsec
          persist-credentials: false
      - name: Assemble public site (allowlisted artifacts)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp central/index.html central/404.html central/CNAME central/.nojekyll _site/
          cp -R central/assets central/AdventuresInMath central/appsec-review central/explorer _site/
          test -s math/output/pdf/ordered_field_reference.pdf
          cp math/output/pdf/ordered_field_reference.pdf _site/AdventuresInMath/ordered_field_reference.pdf
          # Allowlist exactly the flashcard app and public deck data; never publish review histories.
          mkdir -p _site/AdventuresInMath/flashcards/decks/ordered-fields
          cp math/flashcards/web/index.html math/flashcards/web/flashcards.css math/flashcards/web/app.mjs math/flashcards/web/scheduler.mjs math/flashcards/web/sw.js _site/AdventuresInMath/flashcards/
          cp math/flashcards/content/ordered-fields/manifest.json math/flashcards/content/ordered-fields/unlock-levels.json math/flashcards/content/ordered-fields/coverage.json math/flashcards/content/ordered-fields/stage-*.json _site/AdventuresInMath/flashcards/decks/ordered-fields/
          test -s _site/AdventuresInMath/flashcards/index.html
          test -s _site/AdventuresInMath/flashcards/decks/ordered-fields/manifest.json
          # Verify all stage payloads are in the artifact before publishing.
          node -e 'const fs=require("node:fs");const d="_site/AdventuresInMath/flashcards/decks/ordered-fields";const m=JSON.parse(fs.readFileSync(d+"/manifest.json"));let n=0;for(const s of m.stages){const cards=JSON.parse(fs.readFileSync(d+"/"+s.file));if(cards.length!==s.card_ids.length)throw Error("stage mismatch: "+s.file);n+=cards.length;}if(n!==m.cards.length)throw Error("manifest mismatch");console.log("Publishing "+n+" Foundations flashcards");'
          node --check _site/AdventuresInMath/flashcards/app.mjs
          node --check _site/AdventuresInMath/flashcards/scheduler.mjs
          test -s appsec/review-process.html
          cp appsec/review-process.html _site/appsec-review/review-process.html
          test -s _site/index.html
          test -s _site/assets/css/site.css
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
